name: Deploy dashboard to GitHub Pages

# Publishes ./docs (the generated NOVA QA→Prod handoff dashboard) to GitHub Pages.
# Runs on every push to main — the twice-daily handoff routine commits a refreshed
# docs/index.html, and this workflow deploys it with no approval gate. Can also be
# run manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        # enablement:true turns Pages on for the repo automatically on first run,
        # so no manual Settings toggle is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
